<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;

  /* 🌸 BACKGROUND BUNGA */
  background:
    url('https://www.transparenttextures.com/patterns/flowers.png'),
    linear-gradient(135deg,#fffaf6,#f7efe8);

  background-attachment: fixed;
  color:#4e3b31;
  overflow-x:hidden;
}

/* COVER */
.cover{
  height:100vh;

  /* 🌸 COVER BUNGA LEBIH HALUS */
  background:
    linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
    url('https://images.unsplash.com/photo-1520854221256-17451cc331bf') center/cover;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
}

.cover h1{
  font-family:'Playfair Display',serif;
  font-size:42px;
  letter-spacing:1px;
}

button{
  margin-top:20px;
  padding:12px 25px;
  border-radius:30px;
  border:none;
  background:#b08968;
  color:white;
  cursor:pointer;
}

/* SECTION */
.section{
  padding:60px 20px;
  text-align:center;
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.section.show{
  opacity:1;
  transform:translateY(0);
}

h2{
  font-family:'Playfair Display',serif;
  margin-bottom:10px;
}

/* GALERI */
.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

/* LIGHTBOX */
.lightbox{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.lightbox img{
  max-width:90%;
}

/* MAP */
iframe{
  width:100%;
  height:250px;
  border-radius:10px;
}

/* COUNTDOWN */
#countdown{
  margin-top:10px;
  font-weight:bold;
}

/* FLOWER ANIMATION */
.flower{
  position:fixed;
  top:-50px;
  width:22px;
  opacity:0.8;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
  }
}

/* FORM */
input,textarea{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:1px solid #ccc;
}

</style>
</head>

<body>

<!-- COVER -->
<section class="cover" id="cover">
  <p>The Wedding Of</p>
  <h1>Ahmad & Siti</h1>
  <p id="guest"></p>
  <button onclick="openInvite()">Buka Undangan</button>
</section>

<!-- CONTENT -->
<div id="content" style="display:none;">

<section class="section">
  <p>بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم</p>
  <p>Assalamu’alaikum Warahmatullahi Wabarakatuh</p>
</section>

<section class="section">
  <h2>Ahmad & Siti</h2>
  <p>Putra & Putri dari keluarga tercinta</p>
</section>

<section class="section">
  <h2>Akad & Resepsi</h2>
  <p>12 Desember 2026</p>
</section>

<section class="section">
  <h2>Countdown</h2>
  <div id="countdown"></div>
</section>

<section class="section">
  <h2>Galeri</h2>
  <div class="gallery">
    <img src="https://picsum.photos/200?1">
    <img src="https://picsum.photos/200?2">
    <img src="https://picsum.photos/200?3">
    <img src="https://picsum.photos/200?4">
  </div>
</section>

<section class="section">
  <h2>Lokasi</h2>
  <iframe src="https://maps.google.com/maps?q=jakarta&output=embed"></iframe>
</section>

<section class="section">
  <h2>Amplop Digital</h2>
  <p>Bank BCA: 123456789 a.n Ahmad</p>
</section>

<section class="section">
  <h2>Ucapan</h2>
  <input placeholder="Nama">
  <textarea placeholder="Ucapan"></textarea>
  <button>Kirim</button>
</section>

</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img">
</div>

<audio id="music" loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<script>

function openInvite(){
  document.getElementById('cover').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('music').play();
  animate();
  flower();
}

/* ANIMATION */
function animate(){
  const sections=document.querySelectorAll('.section');
  const obs=new IntersectionObserver(e=>{
    e.forEach(x=>{
      if(x.isIntersecting)x.target.classList.add('show');
    });
  });
  sections.forEach(s=>obs.observe(s));
}

/* COUNTDOWN */
const eventDate=new Date("Dec 12, 2026 10:00:00").getTime();
setInterval(()=>{
  const now=new Date().getTime();
  const d=eventDate-now;

  const days=Math.floor(d/(1000*60*60*24));
  const hours=Math.floor((d%(1000*60*60*24))/(1000*60*60));
  const minutes=Math.floor((d%(1000*60*60))/(1000*60));

  document.getElementById("countdown").innerHTML=
    `${days} hari ${hours} jam ${minutes} menit`;
},1000);

/* GUEST */
const url=new URLSearchParams(window.location.search);
const guest=url.get("to");
if(guest){
  document.getElementById("guest").innerText="Kepada "+guest;
}

/* LIGHTBOX */
document.querySelectorAll(".gallery img").forEach(img=>{
  img.onclick=()=>{
    document.getElementById("lightbox").style.display="flex";
    document.getElementById("lightbox-img").src=img.src;
  };
});

document.getElementById("lightbox").onclick=()=>{
  document.getElementById("lightbox").style.display="none";
};

/* FLOWER */
function flower(){
  setInterval(()=>{
    let f=document.createElement("img");
    f.src="assets/bunga.jpg";
    f.className="flower";
    f.style.left=Math.random()*100+"vw";
    f.style.animationDuration=(Math.random()*5+5)+"s";
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),10000);
  },300);
}

</script>

</body>
</html>
